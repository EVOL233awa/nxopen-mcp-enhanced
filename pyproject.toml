[project]
name = "nxopen-mcp-enhanced"
version = "1.0.0"
description = "Enhanced fork of nxopen-mcp: NXOpen .NET API retrieval with remote embedding, optional reranking and offline-safe fallbacks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "nxopen", "siemens-nx", "rag", "llm", "cam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "typer>=0.12",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
embed = ["FlagEmbedding>=1.3"]
reflect = ["pythonnet>=3.0"]
dev = ["pytest>=8.0"]

[project.urls]
Upstream = "https://github.com/mingfeng6684/nxopen-mcp"
Repository = "https://github.com/mingfeng6684/nxopen-mcp"

[project.scripts]
nxopen-mcp-enhanced = "nxopen_mcp_enhanced.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nxopen_mcp_enhanced"]

[tool.pytest.ini_options]
testpaths = ["tests"]
